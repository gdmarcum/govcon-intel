services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: govcon
      POSTGRES_PASSWORD: govcon
      POSTGRES_DB: govcon_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/govcon_dev_pw
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      - postgres
      - neo4j
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  web:
    build: ./apps/web
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  pgdata:
  neo4jdata:
